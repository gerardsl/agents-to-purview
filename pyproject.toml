[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "six-agents-purview"
version = "0.1.0"
description = "Six real framework test agents and a guided Microsoft Purview connection lab."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.17.0",
    "agent-framework-purview==1.0.0b260730",
    "langgraph==1.2.11",
    "autogen-agentchat==0.7.5",
    "pydantic-ai-slim==2.39.0",
    "openai-agents==0.22.0",
    "agno==3.0.6",
    "azure-identity==1.25.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
]
test = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=6,<8",
    "pytest-socket>=0.7,<1",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/purview_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "live: opt-in tests that send synthetic interactions to a real Microsoft tenant",
    "notebook: executes the complete notebook in a real Jupyter kernel",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".python", ".tools", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebook.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["agent_framework_purview", "agent_framework_purview.*"]
follow_untyped_imports = true
